apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: dev

spec:
  replicas: {{ .Values.auth.replicaCount }}

  selector:
    matchLabels:
      app: auth-service

  template:
    metadata:
      labels:
        app: auth-service

    spec:
      containers:
      - name: auth-service
        image: {{ .Values.auth.image }}
        imagePullPolicy: Never

        ports:
        - containerPort: 5001

        readinessProbe:
          httpGet:
            path: /health
            port: 5001

          initialDelaySeconds: 5
          periodSeconds: 5

        livenessProbe:
          httpGet:
            path: /health
            port: 5001

          initialDelaySeconds: 10
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: dev

spec:
  selector:
    app: auth-service

  ports:
  - port: 80
    targetPort: 5001

  type: ClusterIP

name: Build Employee Service

on:
  push:
    paths:
      - 'employee-service/**'
      - '.github/workflows/employee-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed for git push
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/employee-service:${{ github.sha }} \
            ./employee-service

      - name: Push Image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/employee-service:${{ github.sha }}

      - name: Update Helm Tag
        run: |
          sed -i "s|tag: .*|tag: ${{ github.sha }}|" enterprise-platform/values.yaml

      - name: Commit Updated Tag
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add enterprise-platform/values.yaml

          git diff --staged --quiet || \
          git commit -m "Update employee image tag to ${{ github.sha }}"

          git push

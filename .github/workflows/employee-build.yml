name: Build Employee Service

on:
  push:
    paths:
      - 'employee-service/**'
      - '.github/workflows/employee-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Image
      run: |
        docker build \
        -t ghcr.io/${{ github.repository_owner }}/employee-service:latest \
        ./employee-service

    - name: Push Image
      run: |
        docker push \
        ghcr.io/${{ github.repository_owner }}/employee-service:latest
